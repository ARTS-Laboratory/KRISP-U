[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "krispu-legacy"
version = "0.1.0"
description = "Historical PyKrige implementation of KRISP-U."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "CC-BY-SA-4.0" }
authors = [
  { name = "Matthew Burnett" },
  { name = "Austin Downey" },
]
dependencies = [
  "matplotlib>=3.7",
  "numpy>=1.24",
  "opencv-python>=4.8",
  "pykrige>=1.7",
  "scikit-learn>=1.2",
  "scipy>=1.10",
]

[project.urls]
Homepage = "https://github.com/ARTS-Laboratory/KRISP-U"
Repository = "https://github.com/ARTS-Laboratory/KRISP-U"

[tool.setuptools]
package-dir = { "" = "source" }
py-modules = ["KRISPU", "Utilities"]
