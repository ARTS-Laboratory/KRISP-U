experiment_name: paired_smoke
include_noisy_field: true
fields:
  - smooth
  - localized
  - anisotropic
  - rough_correlated
  - rough_multiscale
methods:
  - raw_loo_sensitivity
  - support_adjusted_krispu
  - posterior_std
