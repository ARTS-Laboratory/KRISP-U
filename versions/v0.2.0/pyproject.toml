[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "krispu"
version = "0.2.0"
description = "GPR-based active field reconstruction, validation, and plotting tools."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "CC-BY-SA-4.0" }
authors = [
  { name = "Matthew Burnett" },
  { name = "Austin Downey" },
]
keywords = [
  "active-learning",
  "field-reconstruction",
  "gaussian-process",
  "design-of-experiments",
  "krispu",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "scikit-learn>=1.2",
]

[project.scripts]
krispu-recommend = "krispu.cli:main"

[project.optional-dependencies]
plot = ["matplotlib>=3.7", "pillow>=10.0"]
test = ["pytest>=7.4"]
dev = [
  "black>=24.0",
  "pytest>=7.4",
  "ruff>=0.5",
]

[project.urls]
Homepage = "https://github.com/ARTS-Laboratory/KRISP-U"
Repository = "https://github.com/ARTS-Laboratory/KRISP-U"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
